workflows:
    react-native-ios:
        name: React Native iOS
        max_build_duration: 120
        instance_type: mac_mini_m2
        integrations:
          app_store_connect: Codemagic Appstore Key
        environment:
          ios_signing:
            distribution_type: ad_hoc
            bundle_identifier: com.codemagic.cmreactnative.io
          vars:
            BUNDLE_ID: "com.codemagic.cmreactnative.io"
            XCODE_WORKSPACE: "cmreactnative.xcworkspace"
            XCODE_SCHEME: "cmreactnative"
            APP_ID: 6741536106
          node: v19.7.0
          xcode: latest
          cocoapods: default
        scripts:
            - name: Set Info.plist values
              script: | 
                PLIST=$CM_BUILD_DIR/$XCODE_SCHEME/Info.plist
                PLIST_BUDDY=/usr/libexec/PlistBuddy
                $PLIST_BUDDY -c "Add :ITSAppUsesNonExemptEncryption bool false" $PLIST        
            - name: Install npm dependencies
              script: |
                npm install
            - name: Set up code signing settings on Xcode project
              script: |
                xcode-project use-profiles --warn-only
            - name: Increment build number
              script: |
                cd $CM_BUILD_DIR/ios
                LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_ID")
                agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
            - name: Build ipa for distribution
              script: |
                xcode-project build-ipa --archive-flags="-destination 'generic/platform=iOS'" \
                  --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
                  --scheme "$XCODE_SCHEME"
        artifacts:
            - build/ios/ipa/*.ipa
            - /tmp/xcodebuild_logs/*.log
            - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
            - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
        publishing:
          email:
            recipients:
              - user_1@example.com
            notify:
              success: false
              failure: false
          app_store_connect:
            auth: integration
            submit_to_testflight: true
            submit_to_app_store: false
